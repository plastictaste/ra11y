<!--
  Bad: <a href="javascript:;"> — the "empty statement" variant of the
  non-navigating javascript: scheme. Screen readers still announce this
  as a link; clicking does nothing on its own.
  Expect: rule navigation/href-javascript-scheme fires once at severity "error".
-->
<!doctype html>
<html lang="en">
  <body>
    <a href="javascript:;" onclick="openDialog()">Open dialog</a>
  </body>
</html>
