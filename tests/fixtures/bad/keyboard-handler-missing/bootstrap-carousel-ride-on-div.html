<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bootstrap carousel auto-ride on non-focusable root</title>
  </head>
  <body>
    <!-- data-bs-ride="carousel" starts auto-advance on page load.
         The carousel root is not focusable, and the attribute is a
         behavior declaration that should live on an element keyboard
         users can reach (or the pause/controls must be surfaced
         elsewhere — see 2.2.2 as well). -->
    <div id="hero-carousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="slide-1.jpg" alt="Slide 1" />
        </div>
        <div class="carousel-item">
          <img src="slide-2.jpg" alt="Slide 2" />
        </div>
      </div>
    </div>
  </body>
</html>
