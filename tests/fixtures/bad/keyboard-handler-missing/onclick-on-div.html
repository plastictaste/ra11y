<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Raw onclick on a div</title>
  </head>
  <body>
    <!-- Event-handler grammar (the original failure pattern). Div is
         not focusable, no keyboard pathway. The mouse can click;
         Tab+Enter cannot. -->
    <div onclick="saveThing()" class="action-tile">Save</div>
  </body>
</html>
