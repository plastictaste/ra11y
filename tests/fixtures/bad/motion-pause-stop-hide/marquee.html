<html lang="en">

    <meta charset="utf-8" />
    <title>motion/pause-stop-hide — bad (legacy marquee element)</title>
  </head>
  <body>
    <!--
      <marquee> is obsolete HTML with no built-in pause mechanism; it
      scrolls indefinitely for every user. The rule flags every instance
      regardless of surrounding controls.
    -->
    <marquee>Breaking news: accessibility remediation in progress</marquee>
  </body>
