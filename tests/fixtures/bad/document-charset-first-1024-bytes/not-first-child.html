<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Charset is present but in the wrong place</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
  </head>
  <body>
    <p>The charset declaration must precede the title — otherwise the
    title is decoded under a guessed encoding.</p>
  </body>
</html>
