<!DOCTYPE html>
<html lang="en">
  <head><title>Sign in</title></head>
  <body>
    <form>
      <!--
        Copy-paste mismatch: the password field's <label> still carries
        for="email" from the email field above. The for= resolves to a
        real id elsewhere in this document, so screen readers announce
        "Password:" against the email input (double-named) while the
        password input reports as unlabeled.
      -->
      <label for="email">Email:</label>
      <input id="email" type="email" autocomplete="email">

      <label for="email">Password:</label>
      <input id="password" type="password" autocomplete="current-password">

      <button type="submit">Sign in</button>
    </form>
  </body>
</html>
