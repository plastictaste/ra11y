<!doctype html>
<html lang="en">
<head><title>Self-focusable hidden button</title></head>
<body>
  <!-- The control itself is the focusable element with inline display:none.
       Replacing the inline style with the `hidden` attribute (or removing
       the element if it's residue) is the durable fix. -->
  <button style="display: none">Hidden Action</button>
</body>
</html>
