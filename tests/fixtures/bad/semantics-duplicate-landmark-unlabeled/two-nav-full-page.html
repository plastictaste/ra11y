<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Two unlabeled nav landmarks</title>
  </head>
  <body>
    <header>
      <!-- Desktop and mobile copies of the primary nav. Both
           announce as "navigation" with no distinguishing name,
           so screen-reader users can't tell them apart. -->
      <nav class="nav-desktop">
        <a href="/">Home</a>
        <a href="/docs">Docs</a>
      </nav>
      <nav class="nav-mobile">
        <a href="/">Home</a>
        <a href="/docs">Docs</a>
      </nav>
    </header>
    <main>content</main>
  </body>
</html>
