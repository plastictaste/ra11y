<!--
  Bad: three "Read more" anchors share the same accessible name but
  point at three different blog posts. A screen-reader user navigating
  by link list (VoiceOver rotor, JAWS links dialog) hears the same
  "Read more" three times but lands on a different post each time —
  exactly the failure SC 2.4.4 (and 2.4.9 AAA) describes.
  Expect: rule navigation/link-descriptive-text fires the
  duplicate-name-different-href path three times (once per anchor),
  with messages that mention "share the accessible name" and report a
  count of 3 distinct destinations.
-->
<!doctype html>
<html lang="en">
  <body>
    <article>
      <h2>Post 1</h2>
      <a href="/posts/1">Read more</a>
    </article>
    <article>
      <h2>Post 2</h2>
      <a href="/posts/2">Read more</a>
    </article>
    <article>
      <h2>Post 3</h2>
      <a href="/posts/3">Read more</a>
    </article>
  </body>
</html>
