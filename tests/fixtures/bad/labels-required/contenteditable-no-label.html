<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Composer</title>
  </head>
  <body>
    <!--
      A contenteditable="true" host acts as a form control (Slack-style
      composer) but has no accessible name — screen readers will announce
      the editable region with no context.
    -->
    <div contenteditable="true"></div>
  </body>
</html>
