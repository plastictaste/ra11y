<!doctype html>
<html lang="en">
  <body>
    <!--
      HTML ids forbid ASCII whitespace. "hero banner" tokenizes as two
      ids under the space-separated parsing contract, so getElementById,
      aria-labelledby, and CSS selectors all mis-resolve.
    -->
    <section id="hero banner">
      <h1>Welcome</h1>
    </section>
  </body>
</html>
