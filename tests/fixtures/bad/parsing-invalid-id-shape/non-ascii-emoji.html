<!doctype html>
<html lang="en">
  <body>
    <main>
      <!--
        Emojis in ids are technically legal HTML5 but break URL-fragment
        routing in older browsers, AT keyboard-shortcut tables, and many
        CSS selector / getElementById polyfills. Stick to ASCII-safe
        characters [A-Za-z0-9_-].
      -->
      <section id="emoji-🎉">
        <h1>Celebration</h1>
      </section>
    </main>
  </body>
</html>
