<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Empty href placeholder</title>
  </head>
  <body>
    <!-- href="" is a non-navigating placeholder — it reloads the page and
         is announced as a generic container by screen readers. With an
         onclick it's a dead keyboard-inaccessible control. -->
    <a href="" onclick="doThing()">Click me</a>
  </body>
</html>
