<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Dropdown with href="#" placeholder</title>
  </head>
  <body>
    <!-- Bootstrap-style pattern: href="#" as a dummy target because the
         click handler does the work. Indistinguishable from missing href
         to keyboard + screen-reader users. -->
    <div class="dropdown">
      <a href="#" onclick="toggleMenu()">Menu</a>
      <a href="  #  " onclick="openModal()">Settings</a>
    </div>
  </body>
</html>
