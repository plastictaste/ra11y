<!doctype html>
<html lang="en">
  <head><title>Placeholder image host</title></head>
  <body>
    <!-- Src points at a known placeholder image service. The host is
         the placeholder evidence regardless of what alt says — the
         rendered image is a colored rectangle from the service, not
         the real content the page eventually ships. -->
    <img src="http://placehold.it/700x400" alt="Hero banner">
    <img src="https://via.placeholder.com/300" alt="Card image">
    <img src="https://picsum.photos/200/300" alt="random">
    <img src="https://dummyimage.com/600x400/cccccc/000000" alt="600 by 400">
  </body>
</html>
