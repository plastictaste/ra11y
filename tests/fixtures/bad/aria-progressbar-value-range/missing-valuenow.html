<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Progressbar — bad (no aria-valuenow, not indeterminate)</title>
  </head>
  <body>
    <!--
      Bounds declared but no aria-valuenow, and no indeterminate signal
      (aria-busy absent). Screen readers announce "progress bar" with no
      current value.
    -->
    <div role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-label="Upload"></div>
  </body>
</html>
