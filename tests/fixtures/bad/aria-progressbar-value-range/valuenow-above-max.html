<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Progressbar — bad (aria-valuenow past aria-valuemax)</title>
  </head>
  <body>
    <!--
      aria-valuenow=150 with aria-valuemax=100 — assistive tech
      announces "150 percent", which is meaningless. Either raise max
      (if the scale is really 0..150) or lower valuenow to match the
      actual progress.
    -->
    <div role="progressbar" aria-valuenow="150" aria-valuemin="0" aria-valuemax="100"></div>
  </body>
</html>
