<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Color-only status: bare text-danger</title>
  </head>
  <body>
    <!-- Bootstrap's `.text-danger` paints the text red as a status
         signal. Sighted users see "red text" and read "error." Screen-
         reader users, colorblind users, and anyone under a color-
         inverted theme hear plain prose with no indication that
         "Access denied" is an error state. -->
    <main>
      <span class="text-danger">Access denied</span>
    </main>
  </body>
</html>
