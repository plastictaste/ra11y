<!doctype html>
<html lang="en">
<head><title>Welcome to Acme</title></head>
<body>
  <!-- Good: a genuine layout table — role="presentation" is honest because
       the subtree contains no <th>, no <caption>, and no scope/headers
       attributes. The table is just a 2-column visual grid for an email
       template; AT will treat it as flow content. -->
  <table role="presentation" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td><img src="logo.png" alt="Acme"></td>
      <td>Welcome to Acme</td>
    </tr>
    <tr>
      <td colspan="2">Body content laid out in a grid</td>
    </tr>
  </table>
</body>
</html>
