<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Card with a single stretched-link — canonical pattern</title>
  </head>
  <body>
    <article class="card">
      <div class="card-body">
        <h3 class="card-title">Product</h3>
        <p class="card-text">A useful product.</p>
        <a href="/product" class="stretched-link">View product</a>
      </div>
    </article>
  </body>
</html>
