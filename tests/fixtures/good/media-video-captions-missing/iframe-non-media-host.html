<!doctype html>
<html lang="en">
  <body>
    <!--
      Not a video embed — the allowlist does not flag generic CMS /
      widget iframes because we can't tell from the host alone whether
      media is present. The document/iframe-title rule covers naming
      concerns separately.
    -->
    <iframe
      src="https://example.com/forms/signup"
      title="Newsletter signup"
      width="400"
      height="200"
    ></iframe>
  </body>
</html>
