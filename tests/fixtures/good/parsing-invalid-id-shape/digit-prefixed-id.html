<!doctype html>
<html lang="en">
  <body>
    <!--
      Legal HTML5: ids MAY start with a digit. Many CSS frameworks and
      content-driven sites (year-scoped anchors, numbered sections) rely
      on this. The rule deliberately does NOT flag digit-prefixed ids
      because the false-positive rate would be high.
    -->
    <section id="2024-roadmap">
      <h1>2024 roadmap</h1>
    </section>
  </body>
</html>
