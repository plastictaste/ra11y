<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Profile</title>
  </head>
  <body>
    <!--
      Compliant: the label has no visible required marker, so this rule
      has nothing to say about the input's lack of `required`. (Whether
      the input *should* be required is a separate authoring question
      the rule doesn't try to answer.)
    -->
    <form>
      <label for="nick">Nickname (optional)</label>
      <input id="nick" type="text" />
    </form>
  </body>
</html>
