<!--
  the fixed shape.
  Each icon-only <button> carries the glyph-derived aria-label; the
  inner <i> carries aria-hidden="true" so AT announces "Menu button"
  once, not "Menu button, fa-bars".
-->
<!DOCTYPE html>
<html lang="en">
  <body>
    <nav>
      <button aria-label="Menu"><i class="fa-bars" aria-hidden="true"></i></button>
      <button aria-label="Search"><i class="fa fa-search" aria-hidden="true"></i></button>
      <button aria-label="Close"><i class="fas fa-times" aria-hidden="true"></i></button>
      <button aria-label="Notifications"><i class="fa fa-bell" aria-hidden="true"></i></button>
      <button aria-label="Account"><i class="fa fa-user" aria-hidden="true"></i></button>
    </nav>
  </body>
</html>
