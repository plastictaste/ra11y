<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>motion/pause-stop-hide — good (Bootstrap carousel without auto-advance)</title>
  </head>
  <body>
    <!--
      Without `data-bs-ride="carousel"` on the outer element, Bootstrap
      does not auto-start cycling on page load. User-driven navigation via
      the prev/next buttons is what WCAG 2.2.2 is asking for: the user
      decides when the content changes.
    -->
    <div id="hero" class="carousel slide">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="/hero-1.jpg" class="d-block w-100" alt="Product family one" />
        </div>
        <div class="carousel-item">
          <img src="/hero-2.jpg" class="d-block w-100" alt="Product family two" />
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#hero" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#hero" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </body>
</html>
