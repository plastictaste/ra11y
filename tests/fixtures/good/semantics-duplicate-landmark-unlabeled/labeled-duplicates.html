<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Labeled duplicate landmarks</title>
  </head>
  <body>
    <header>
      <!-- Both navs have distinguishing aria-label values, so a
           screen-reader user cursoring the landmark list reads
           "Primary navigation" and "Footer navigation" and can
           choose. -->
      <nav aria-label="Primary">
        <a href="/">Home</a>
        <a href="/docs">Docs</a>
      </nav>
    </header>
    <main>content</main>
    <footer>
      <nav aria-label="Footer">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
      </nav>
    </footer>
  </body>
</html>
