<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Single nav, full page</title>
  </head>
  <body>
    <!-- A single unlabeled <nav> on a full-page document is
         acceptable — WAI-ARIA recommends labels on duplicates, not
         on unique landmarks. The fragment path deliberately does
         not apply here (we know this file is a full page). -->
    <header>
      <nav>
        <a href="/">Home</a>
        <a href="/docs">Docs</a>
      </nav>
    </header>
    <main>primary content</main>
    <footer>footer</footer>
  </body>
</html>
