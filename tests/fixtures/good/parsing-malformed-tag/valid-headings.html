<!doctype html>
<html lang="en">
  <head>
    <title>Valid heading hierarchy</title>
  </head>
  <body>
    <main>
      <h1>Document title</h1>
      <h2>Article</h2>
      <h3>Sub-section</h3>
      <h4>Detail</h4>

      <p>All headings here are valid (h1-h6); no malformed-tag finding fires.</p>
    </main>
  </body>
</html>
