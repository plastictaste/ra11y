<!--
  Good: three "Read more" anchors share the same accessible name but
  each href is distinct (a separate blog post). Same-name-different-href
  is a legitimate pattern in some nav designs — agent judgment required,
  and the rule intentionally stays silent on this shape. (The generic-
  phrase path is unrelated to this fixture's focus — it would fire on
  "Read more" as a generic phrase independently; that's a separate
  concern covered by other fixtures.)
  Expect: rule navigation/link-descriptive-text does NOT fire the
  duplicate-href path on these anchors.
-->
<!doctype html>
<html lang="en">
  <body>
    <article>
      <h2>Post 1</h2>
      <a href="/posts/1">View the post about accessible navigation</a>
    </article>
    <article>
      <h2>Post 2</h2>
      <a href="/posts/2">View the post about keyboard support</a>
    </article>
    <article>
      <h2>Post 3</h2>
      <a href="/posts/3">View the post about ARIA patterns</a>
    </article>
  </body>
</html>
