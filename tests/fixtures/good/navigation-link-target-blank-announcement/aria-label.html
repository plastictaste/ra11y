<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>target='_blank' with aria-label announcement</title>
  </head>
  <body>
    <!-- aria-label carries the new-window announcement so screen-reader
         users know the link will open a new tab before they activate
         it. Satisfies WCAG 3.2.5 (Change on Request). -->
    <p>
      See the
      <a href="https://example.com/docs" target="_blank" aria-label="API docs (opens in new window)">API docs</a>
      for reference.
    </p>
  </body>
</html>
