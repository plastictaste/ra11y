<!doctype html>
<html lang="en">
  <head><title>Sign up</title></head>
  <body>
    <main>
      <h1>Sign up</h1>
      <!--
        The visible bare-`*` convention is paired with a programmatic
        required signal on every control: HTML's boolean `required`
        attribute (Email, Password) and `aria-required="true"` on the
        Display name input where the form library can't add `required`
        without also blocking submission. Both shapes satisfy SC 1.3.1
        + 3.3.2; the visible marker can stay as-is.
      -->
      <form action="/signup" method="post">
        <label for="email">Email *</label>
        <input id="email" type="email" required>

        <label for="password">Password *</label>
        <input id="password" type="password" required>

        <label for="display">Display name *</label>
        <input id="display" type="text" aria-required="true">

        <button type="submit">Sign up</button>
      </form>
    </main>
  </body>
</html>
