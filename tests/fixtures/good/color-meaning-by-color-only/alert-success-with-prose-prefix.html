<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>alert-success with prose "Success:" prefix</title>
  </head>
  <body>
    <!-- Second channel via prose prefix: "Success:" at the start of
         the visible text names the status word explicitly. The color
         is redundant reinforcement, not the sole channel. -->
    <main>
      <div class="alert alert-success">Success: Your changes have been saved.</div>
    </main>
  </body>
</html>
