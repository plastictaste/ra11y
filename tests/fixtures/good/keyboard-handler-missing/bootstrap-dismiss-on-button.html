<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bootstrap dismiss on native &lt;button&gt;</title>
  </head>
  <body>
    <div class="toast" role="alert">
      <div class="toast-header">
        Notification
        <!-- Close control is a real button — focusable, keyboard-
             activatable, and announced correctly as "close". -->
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body">Saved.</div>
    </div>
  </body>
</html>
