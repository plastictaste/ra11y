<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bootstrap modal toggle on native &lt;button&gt;</title>
  </head>
  <body>
    <!-- data-bs-toggle on a <button> is the canonical Bootstrap
         pattern: button is focusable, announces as "button" to AT,
         and Enter/Space activate natively. Bootstrap's JS still
         wires the toggle off the attribute. -->
    <button type="button" data-bs-toggle="modal" data-bs-target="#demo-modal">
      Open dialog
    </button>
  </body>
</html>
