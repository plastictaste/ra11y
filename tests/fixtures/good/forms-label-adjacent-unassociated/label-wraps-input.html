<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Length picker</title>
  </head>
  <body>
    <!--
      Implicit association — the <label> wraps the control, which is a
      spec-valid form of label-control association. The rule does not fire.
    -->
    <label>
      Length
      <input id="length" type="number" />
    </label>
  </body>
</html>
