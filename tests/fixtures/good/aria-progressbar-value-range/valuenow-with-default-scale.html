<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Progressbar — good (default 0..100 scale)</title>
  </head>
  <body>
    <!--
      Minimal valid progressbar: aria-valuenow declared, aria-valuemin and
      aria-valuemax omitted (WAI-ARIA 1.2 defaults to 0..100 on progressbar).
    -->
    <div role="progressbar" aria-valuenow="30" aria-label="Upload progress"></div>
  </body>
</html>
