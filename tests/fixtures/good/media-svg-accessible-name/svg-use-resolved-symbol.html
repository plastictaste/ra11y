<!--
  Good: an inline <svg> inside <button> uses a sprite reference that
  resolves to a same-file <symbol id="search-icon"> whose own <title>
  child carries the name. SVG 2 propagates the symbol's title to the
  <use> reference.
  Expect: no findings.
-->
<!doctype html>
<html lang="en">
  <body>
    <svg style="display:none" aria-hidden="true">
      <symbol id="search-icon" viewBox="0 0 24 24">
        <title>Search</title>
        <path d="M21 21l-4.35-4.35M5 11a6 6 0 1 1 12 0 6 6 0 0 1-12 0z"/>
      </symbol>
    </svg>
    <button>
      <svg width="20" height="20">
        <use href="#search-icon"/>
      </svg>
    </button>
  </body>
</html>
