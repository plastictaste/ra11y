<!--
  Good: href="#section-name" points at a real in-page id — the browser
  scrolls to and focuses the matching element, which is legitimate
  in-page navigation. Stays silent even though the href begins with "#".
  Expect: rule navigation/href-javascript-void stays silent.
-->
<!doctype html>
<html lang="en">
  <body>
    <nav>
      <a href="#main-content">Skip to content</a>
    </nav>
    <main id="main-content">
      <p>Main content.</p>
    </main>
  </body>
</html>
