<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Error message associated: aria-describedby carries help-id + error-id</title>
  </head>
  <body>
    <!-- The canonical help-text + error-text pattern. aria-describedby
         holds a space-separated list of ids; assistive tech announces
         both, in order, after the field label. -->
    <form>
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        class="form-control is-invalid"
        aria-invalid="true"
        aria-describedby="email-help email-error"
      />
      <small id="email-help">We never share your email.</small>
      <div class="invalid-feedback" id="email-error">
        Please enter a valid email address.
      </div>
    </form>
  </body>
</html>
