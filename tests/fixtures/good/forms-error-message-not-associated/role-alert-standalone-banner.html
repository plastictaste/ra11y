<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Error message standalone: role=alert banner with no sibling form control</title>
  </head>
  <body>
    <!-- A page-level flash banner using role="alert". The rule does
         NOT fire: this is a live-region announcement pattern, not a
         field-level error-identification pair. Coverage for live-region
         validity belongs to aria/live-region-valid. -->
    <main>
      <section>
        <h1>Checkout</h1>
        <p role="alert" id="session-warning">Your session will expire in 2 minutes.</p>
      </section>
    </main>
  </body>
</html>
