<!--
  Sanitized snippet from a representative README file in a Jekyll-style SSG
  corpus: ten adjacent `<a href="..."><img class="sponsor-logo" alt="Sponsor
  N"/></a>` siblings under the same parent, each enumerated by a single
  token difference (Sponsor 1 … Sponsor 10).

  The `class="sponsor-logo"` trigger makes the review/images-of-text
  finder fire via its "class suggests 'logo' artwork" signal on every
  sibling. Before aggregation the finder emitted ten near-identical
  candidates — one per `<img>` — which reads as noise to the agent.
  The fixture locks in the aggregation contract: when ≥4 adjacent
  sibling `<a><img/></a>` wrappings share a structural pattern and
  alt-text differs only by an enumerated token, the finder emits ONE
  consolidated candidate carrying `siblingOccurrences` with the full
  per-sibling line/alt/href trail.
-->
<!doctype html>
<html lang="en">
  <body>
    <section>
      <h2>Sponsors</h2>
      <p>This project is sponsored by the following organizations:</p>
      <div class="sponsors">
        <a href="https://example.com/sponsor-1"><img class="sponsor-logo" src="https://example.com/logos/s1.png" alt="Sponsor 1"/></a>
        <a href="https://example.com/sponsor-2"><img class="sponsor-logo" src="https://example.com/logos/s2.png" alt="Sponsor 2"/></a>
        <a href="https://example.com/sponsor-3"><img class="sponsor-logo" src="https://example.com/logos/s3.png" alt="Sponsor 3"/></a>
