<!--
  Sanitized repro of a CSS-framework corpus floating-label-select pattern.

  The <select> has an aria-label that correctly names the control;
  the <option> children are the widget's VALUE set, not its visible
  label. A <select>'s accessible name per the HTML AAM is
  aria-label / aria-labelledby / <label for>; option text is not
  part of the accessible name, nor of the visible label WCAG 2.5.3
  (Label in Name) compares against.

  This file must produce zero `semantics/label-in-name` findings.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Floating label select</title>
  </head>
  <body>
    <div class="form-floating">
      <select
        class="form-select"
        id="floatingSelect"
        aria-label="Floating label select example"
      >
        <option selected>Open this select menu</option>
        <option value="1">One</option>
        <option value="2">Two</option>
        <option value="3">Three</option>
      </select>
      <label for="floatingSelect">Works with selects</label>
    </div>
  </body>
</html>
