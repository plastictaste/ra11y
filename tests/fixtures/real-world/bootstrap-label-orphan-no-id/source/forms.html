<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms - sb-admin</title>
</head>
<body>
    <div class="container-fluid">
        <h1 class="h3 mb-4 text-gray-800">Forms</h1>

        <!-- Canonical Bootstrap-template orphan-label shape.
             <label>Text Input</label> immediately precedes an <input>
             that carries NO id — 12+ instances across sb-admin/forms.html.
             The rule must fire on each of these even without an id on
             the control, and propose an id synthesized from the label's
             visible text plus a matching for=. -->
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-primary">Circle Buttons</h6>
            </div>
            <div class="card-body">
                <p>Basic Inputs</p>

                <label>Text Input</label>
                <input class="form-control" placeholder="Placeholder">

                <label>Password Input</label>
                <input type="password" class="form-control" placeholder="Password">

                <label>Email Address</label>
                <input type="email" class="form-control" placeholder="Email">

                <label>Number Input</label>
                <input type="number" class="form-control" placeholder="12345">
            </div>
        </div>
    </div>
</body>
</html>
