<!doctype html>
<html>
  <head><title>Native controls with tabindex -1</title></head>
  <body>
    <form>
      <label for="search">Search</label>
      <input id="search" type="text" tabindex="-1" />
      <textarea name="notes" tabindex="-1"></textarea>
      <select name="country" tabindex="-1">
        <option value="us">United States</option>
      </select>
      <button type="submit" tabindex="-1">Submit</button>
      <a href="/help" tabindex="-1">Help</a>
    </form>
  </body>
</html>
