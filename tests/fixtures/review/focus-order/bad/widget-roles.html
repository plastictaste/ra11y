<!doctype html>
<html>
  <head><title>Widget-role divs with tabindex -1</title></head>
  <body>
    <div role="button" tabindex="-1">Pseudo button</div>
    <span role="link" tabindex="-1">Pseudo link</span>
    <div role="checkbox" aria-checked="false" tabindex="-1">Agree</div>
    <div role="switch" aria-checked="false" tabindex="-1">Enable</div>
  </body>
</html>
