<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>aria-label announces the new window</title>
  </head>
  <body>
    <main>
      <p>
        See the docs:
        <a
          href="/docs"
          target="_blank"
          rel="noopener"
          aria-label="Docs (opens in new window)"
        >Docs</a>
      </p>
    </main>
  </body>
</html>
