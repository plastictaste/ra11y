name: VHS

# Regenerate docs/demo.gif when the VHS tape, the CLI entry point, or the
# fixtures the tape exercises change. Keeps the README demo in sync with
# real scanner output without a re-record loop.
#
# The job runs on PRs (so reviewers see the proposed GIF in the diff) and
# on pushes to main (so the committed GIF on main always matches the tape).
# On main, if the regenerated GIF differs from the committed one, the job
# commits the update back. On PRs, it fails instead — the PR author runs
# `vhs docs/demo.tape` locally and commits the new GIF.

on:
  push:
    branches: [main]
    paths:
      - "docs/demo.tape"
      - "src/cli.ts"
      - "src/cli/**"
      - "src/output/formatters/terminal.ts"
      - "tests/fixtures/bad/alt-text-missing/**"
      - "tests/fixtures/bad/contrast-minimum/**"
      - ".github/workflows/vhs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/demo.tape"
      - "src/cli.ts"
      - "src/cli/**"
      - "src/output/formatters/terminal.ts"
      - "tests/fixtures/bad/alt-text-missing/**"
      - "tests/fixtures/bad/contrast-minimum/**"
      - ".github/workflows/vhs.yml"

concurrency:
  group: vhs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: render demo.gif
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to commit the regenerated GIF on main

    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Need full token to push the regenerated GIF back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # vhs-action provisions vhs + ttyd + ffmpeg and runs the tape.
      # TODO: SHA-pin per the project policy on the next ci pin sweep
      # (see commit "ci: pin GitHub Actions to immutable SHAs").
      - name: Render demo.gif via VHS
        uses: charmbracelet/vhs-action@v2
        with:
          path: docs/demo.tape

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- docs/demo.gif; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "demo.gif unchanged — no commit needed"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "demo.gif changed — will commit on main / fail on PRs"
          fi

      # On PRs, fail if the GIF would change. The PR author re-runs
      # `vhs docs/demo.tape` locally and commits the result, so the PR
      # diff carries the visual review the GIF deserves.
      - name: Fail PR on drift
        if: github.event_name == 'pull_request' && steps.drift.outputs.drift == 'true'
        run: |
          echo "::error::docs/demo.gif is stale relative to docs/demo.tape or scanner output."
          echo "::error::Run \`vhs docs/demo.tape\` locally and commit the regenerated GIF."
          exit 1

      # On main, commit the regenerated GIF back so the README always
      # reflects the latest output.
      - name: Commit regenerated GIF
        if: github.event_name == 'push' && steps.drift.outputs.drift == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          git commit -m "chore(docs): regenerate demo.gif via vhs"
          git push
